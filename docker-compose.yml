services:
  web:
    build: .
    ports: ["8082:80"]
    volumes: ["./src:/var/www/html"]
    environment:
      DB_HOST: db
      DB_NAME: qly_ch_quan_ao
      DB_USER: root
      DB_PASS: root
    depends_on: [db]
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qly_ch_quan_ao
    ports: ["3307:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  phpmyadmin:
    image: phpmyadmin:latest
    ports: ["8081:80"]
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on: [db]
volumes:
  dbdata:
